<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BurguerFlow - Atendimento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="container py-4">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-journal-text"></i> Gestão de Atendimento</h2>
            <a href="dashboard.html" class="btn btn-outline-secondary btn-sm">Voltar ao Início</a>
        </div>

        <div class="card card-sistema p-3 mb-4 shadow-sm">
            <h5 class="mb-3 text-muted">Selecione uma Mesa:</h5>
            <div class="row g-2" id="mapa-mesas">
            </div>
        </div>

        <div id="detalhe-mesa" class="card card-sistema p-4 d-none shadow">
            <div class="d-flex justify-content-between align-items-center">
                <h5>Mesa <span id="num-mesa">--</span></h5>
                <span id="status-badge" class="badge"></span>
            </div>
            <hr>

            <div id="conteudo-mesa-dinamico" class="mb-4">
            </div>

            <div id="botoes-acao-mesa" class="row g-2">
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalAdicionarItem" tabindex="-1" aria-labelledby="modalAdicionarItemLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content card-sistema">
                <div class="modal-header border-bottom-0">
                    <h5 class="modal-title fw-bold" id="modalAdicionarItemLabel"><i class="bi bi-plus-circle-fill text-warning"></i> Adicionar Item ao Atendimento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Selecione o Produto</label>
                        <select class="form-select" id="selectProduto">
                            <!-- Carregado Dinamicamente via JS -->
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Observações de Preparo</label>
                        <textarea class="form-control" rows="2" placeholder="Ex: Sem cebola, ponto ao ponto..."></textarea>
                    </div>
                </div>
                <div class="modal-footer border-top-0">
                    <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-verde btn-sm px-3" onclick="confirmarInclusaoItem()" data-bs-dismiss="modal">Lançar Item</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalConfirmarRemocao" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content card-sistema">
                <div class="modal-body text-center pt-4">
                    <i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-3 d-block"></i>
                    <p class="mb-4">Deseja realmente remover <strong id="nome-item-remover">item</strong> desta comanda?</p>
                    <div class="d-flex justify-content-center gap-2">
                        <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Não</button>
                        <button type="button" class="btn btn-sm btn-danger px-3" id="btnConfirmarExclusao">Sim, Remover</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1060">
        <div id="toastSistema" class="toast align-items-center text-white bg-dark border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2">
                    <i class="bi bi-info-circle-fill text-warning"></i>
                    <span id="toastMensagem">Mensagem do sistema</span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let mesaAtualSelecionada = "";
        let itemIndexParaRemover = null;

        // --- MODELO DO BANCO DE DADOS (LOCALSTORAGE) ---
        if (!localStorage.getItem('burguerflow_mesas')) {
            const estruturaInicial = {
                "01": { status: "Livre", itens: [] },
                "02": { status: "Livre", itens: [] },
                "03": { status: "Livre", itens: [] },
                "04": { status: "Livre", itens: [] }
            };
            localStorage.setItem('burguerflow_mesas', JSON.stringify(estruturaInicial));
        }

        function obterDadosMesas() {
            return JSON.parse(localStorage.getItem('burguerflow_mesas'));
        }

        function salvarDadosMesas(dados) {
            localStorage.setItem('burguerflow_mesas', JSON.stringify(dados));
            renderizarMapaMesas(); 
            if (mesaAtualSelecionada) {
                atualizarPainelDetalhes(mesaAtualSelecionada);
            }
        }

        function exibirToast(mensagem) {
            document.getElementById('toastMensagem').innerText = message = mensagem;
            const toastElement = document.getElementById('toastSistema');
            const toast = new bootstrap.Toast(toastElement, { delay: 3500 });
            toast.show();
        }

        // --- CARREGAR CARDÁPIO DINÂMICO ---
        function carregarProdutosNoSelect() {
            const cardapio = JSON.parse(localStorage.getItem('burguerflow_cardapio')) || [
                "X-Burger Clássico - R$ 24,90",
                "X-Salada Especial - R$ 26,90",
                "Batata Frita M - R$ 12,00",
                "Coca-Cola 350ml - R$ 6,00",
                "Suco Natural - R$ 8,00"
            ];

            const select = document.getElementById('selectProduto');
            if (select) {
                select.innerHTML = "";
                cardapio.forEach(item => {
                    select.innerHTML += `<option>${item}</option>`;
                });
            }
        }

        // --- RENDERIZAR O MAPA DE MESAS DINAMICAMENTE ---
        function renderizarMapaMesas() {
            const dados = obterDadosMesas();
            const mapaContainer = document.getElementById('mapa-mesas');
            mapaContainer.innerHTML = ""; 

            Object.keys(dados).forEach(numMesa => {
                const mesa = dados[numMesa];
                const classeBotao = mesa.status === 'Livre' ? 'btn-outline-dark' : 'btn-vermelho';
                const classeSelecao = (numMesa === mesaAtualSelecionada) ? 'mesa-selecionada' : '';

                mapaContainer.innerHTML += `
                    <div class="col-3">
                        <button onclick="verMesa('${numMesa}')" id="btn-mesa-${numMesa}" class="btn btn-mesa ${classeBotao} ${classeSelecao} w-100 py-3 btn-perfil">
                            ${numMesa}
                        </button>
                    </div>
                `;
            });
        }

        // --- SELECIONAR UMA MESA ---
        function verMesa(num) {
            mesaAtualSelecionada = num;

            document.querySelectorAll('.btn-mesa').forEach(btn => btn.classList.remove('mesa-selecionada'));
            const btnAtual = document.getElementById(`btn-mesa-${num}`);
            if (btnAtual) btnAtual.classList.add('mesa-selecionada');

            atualizarPainelDetalhes(num);
        }

        // --- ATUALIZAR CONTEÚDO DOS DETALHES ---
        function atualizarPainelDetalhes(num) {
            const dados = obterDadosMesas();
            const mesa = dados[num];

            document.getElementById('detalhe-mesa').classList.remove('d-none');
            document.getElementById('num-mesa').innerText = num;
            
            const badge = document.getElementById('status-badge');
            badge.innerText = mesa.status;
            badge.className = mesa.status === 'Livre' ? 'badge bg-success' : 'badge bg-danger';
            
            const conteudo = document.getElementById('conteudo-mesa-dinamico');
            const botoes = document.getElementById('botoes-acao-mesa');

            if (mesa.status === 'Livre') {
                conteudo.innerHTML = `<p class="text-muted fst-italic">Esta mesa encontra-se vazia e disponível no momento.</p>`;
                botoes.innerHTML = `
                    <div class="col-12">
                        <button onclick="abrirMesaAtiva()" class="btn btn-verde btn-perfil w-100 py-2">
                            <i class="bi bi-door-open"></i> Abrir Mesa (Ocupar)
                        </button>
                    </div>
                `;
            } else {
                if (mesa.itens.length === 0) {
                    conteudo.innerHTML = `<p class="text-muted fst-italic">Nenhum item lançado nesta comanda ainda.</p>`;
                } else {
                    let itensHTML = `<h6 class="text-muted mb-3">Itens Lançados na Comanda:</h6><div class="list-group gap-2">`;
                    
                    mesa.itens.forEach((item, index) => {
                        let badgeStatus = "";
                        let textDecoration = "text-dark";
                        let botaoEntregue = "";
                        let botaoCancelar = "";

                        if (item.status === "Rascunho") {
                            badgeStatus  = `<span class="badge bg-secondary me-2"><i class="bi bi-clock"></i> A enviar</span>`;
                            botaoCancelar = `<button onclick="solicitarRemocaoItem(${index}, '${item.produto}')" class="btn btn-sm btn-outline-danger" title="Cancelar item"><i class="bi bi-x-lg"></i></button>`;
                        } else if (item.status === "Pendente") {
                            badgeStatus  = `<span class="badge bg-warning text-dark me-2">Na fila da cozinha</span>`;
                            botaoCancelar = `<button onclick="solicitarRemocaoItem(${index}, '${item.produto}')" class="btn btn-sm btn-outline-danger" title="Cancelar item"><i class="bi bi-x-lg"></i></button>`;
                        } else if (item.status === "Em preparo") {
                            badgeStatus = `<span class="badge bg-primary me-2">Em preparo</span>`;
                        } else if (item.status === "Pronto") {
                            const cat = item.categoria || "cozinha";
                            // Balcão: visual de "Pendente" mas já pode entregar
                            // Cozinha: visual de "Pronto!" sinalizando que a cozinha finalizou
                            badgeStatus   = cat === "balcao"
                                ? `<span class="badge bg-warning text-dark me-2">Pendente</span>`
                                : `<span class="badge bg-success me-2"><i class="bi bi-bell-fill"></i> Pronto!</span>`;
                            botaoEntregue = `<button onclick="marcarItemEntregue(${index})" class="btn btn-sm btn-success" title="Confirmar entrega na mesa"><i class="bi bi-check-lg"></i> Entregar</button>`;
                        } else if (item.status === "Entregue") {
                            badgeStatus    = `<span class="badge bg-secondary me-2"><i class="bi bi-check2-all"></i> Entregue</span>`;
                            textDecoration = 'text-decoration-line-through text-muted';
                        }

                        const obsHTML = item.obs ? `<br><small class="text-muted">Obs: ${item.obs}</small>` : '';

                        itensHTML += `
                            <div class="list-group-item d-flex justify-content-between align-items-center border-0 bg-light p-3 rounded shadow-sm">
                                <div>
                                    ${badgeStatus}
                                    <strong class="${textDecoration}">1x ${item.produto}</strong>
                                    ${obsHTML}
                                </div>
                                <div class="btn-group">
                                    ${botaoEntregue}
                                    ${botaoCancelar}
                                </div>
                            </div>
                        `;
                    });

                    itensHTML += `</div>`;
                    conteudo.innerHTML = itensHTML;
                }

                botoes.innerHTML = `
                    <div class="col-6">
                        <button class="btn btn-amarelo btn-perfil w-100 py-2" data-bs-toggle="modal" data-bs-target="#modalAdicionarItem">
                            <i class="bi bi-plus-lg"></i> Adicionar Item
                        </button>
                    </div>
                    <div class="col-6">
                        <button onclick="enviarPedidoParaCozinha()" class="btn btn-verde btn-perfil w-100 py-2">
                            <i class="bi bi-send-fill"></i> Enviar Pedido
                        </button>
                    </div>
                `;
            }
        }

        // --- ABRIR UMA MESA ---
        function abrirMesaAtiva() {
            const dados = obterDadosMesas();
            dados[mesaAtualSelecionada].status = "Ocupada";
            dados[mesaAtualSelecionada].itens = []; 
            
            salvarDadosMesas(dados);
            exibirToast(`Mesa ${mesaAtualSelecionada} aberta com sucesso! Lançamentos liberados.`);
        }

        // --- LANÇAR NOVO ITEM DO MODAL (SALVA COMO RASCUNHO) ---
        function confirmarInclusaoItem() {
            const select = document.getElementById('selectProduto');
            const produtoSelecionado = select.options[select.selectedIndex].text;
            const txtObs = document.querySelector('#modalAdicionarItem textarea');
            const obs = txtObs ? txtObs.value.trim() : "";

            if (!mesaAtualSelecionada) return;

            const dados = obterDadosMesas();
            
            const novoItem = {
                produto: produtoSelecionado,
                status: "Rascunho",
                obs: obs
            };

            dados[mesaAtualSelecionada].itens.push(novoItem);
            salvarDadosMesas(dados);
            
            exibirToast(`"${produtoSelecionado}" adicionado à lista! Não se esqueça de Enviar o Pedido.`);
            if(txtObs) txtObs.value = "";
        }

        // --- DISPARA OS ITENS DO RASCUNHO CONFORME CATEGORIA ---
        function enviarPedidoParaCozinha() {
            if (!mesaAtualSelecionada) return;
            const dados      = obterDadosMesas();
            const categorias = JSON.parse(localStorage.getItem('burguerflow_categorias')) || {};

            let enviouAlgo = false;
            dados[mesaAtualSelecionada].itens.forEach(item => {
                if (item.status === "Rascunho") {
                    const nomeLimpo  = item.produto.split(" - ")[0].trim();
                    const categoria  = categorias[nomeLimpo] || "cozinha";
                    // Balcão: já sai pronto. Cozinha: vai para a fila.
                    item.status      = categoria === "balcao" ? "Pronto" : "Pendente";
                    item.categoria   = categoria;
                    enviouAlgo       = true;
                }
            });

            if (enviouAlgo) {
                salvarDadosMesas(dados);
                exibirToast("Pedido enviado! Itens de balcão já estão prontos para entrega. 🧃🍔🔥");
            } else {
                exibirToast("Não há novos itens para enviar.");
            }
        }

        // --- MUDAR STATUS DO ITEM PARA ENTREGUE ---
        function marcarItemEntregue(index) {
            const dados = obterDadosMesas();
            const item = dados[mesaAtualSelecionada].itens[index];
            item.status = "Entregue";
            
            salvarDadosMesas(dados);
            exibirToast(`Status de "${item.produto}" alterado para: Entregue!`);
        }

        // --- ABRIR MODAL DE CONFIRMAÇÃO DE REMOÇÃO ---
        function solicitarRemocaoItem(index, nomeItem) {
            itemIndexParaRemover = index;
            document.getElementById('nome-item-remover').innerText = `"${nomeItem}"`;
            
            const modalElement = document.getElementById('modalConfirmarRemocao');
            const modal = new bootstrap.Modal(modalElement);
            modal.show();
        }   

        // --- CONFIRMAR EXCLUSÃO DENTRO DO MODAL ---
        document.getElementById('btnConfirmarExclusao').addEventListener('click', function() {
            if (itemIndexParaRemover !== null) {
                const dados = obterDadosMesas();
                const nomeItem = dados[mesaAtualSelecionada].itens[itemIndexParaRemover].produto;
                
                dados[mesaAtualSelecionada].itens.splice(itemIndexParaRemover, 1);
                salvarDadosMesas(dados);
                
                const modalElement = document.getElementById('modalConfirmarRemocao');
                const modal = bootstrap.Modal.getInstance(modalElement);
                modal.hide();
                
                exibirToast(`O item "${nomeItem}" foi removido com sucesso.`);
                itemIndexParaRemover = null;
            }
        });

        window.onload = function() {
            renderizarMapaMesas();
            carregarProdutosNoSelect();
            // Seleciona a mesa 01 por padrão ao abrir a tela
            verMesa("01");
        };

        // Escuta alterações vindas do Admin/Cozinha/Caixa e atualiza tudo em tempo real
        window.addEventListener('storage', function(e) {
            if (e.key === 'burguerflow_mesas') {
                renderizarMapaMesas();
                if (mesaAtualSelecionada) {
                    atualizarPainelDetalhes(mesaAtualSelecionada);
                }
            }
            if (e.key === 'burguerflow_cardapio') {
                carregarProdutosNoSelect();
            }
        });
    </script>
</body>
</html>
