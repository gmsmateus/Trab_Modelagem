<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BurguerFlow - Cozinha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="estilo.css">
</head>
<body class="bg-light">
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-fire"></i> Monitor da Cozinha (Fila de Preparo)</h2>
        <a href="dashboard.html" class="btn btn-outline-secondary btn-sm">Voltar</a>
    </div>

    <div class="row g-3 px-1" id="fila-cozinha-container" style="max-height:75vh;overflow-y:auto;"></div>
</div>

<!-- MODAL CONFIRMAR PRONTO -->
<div class="modal fade" id="modalConfirmarCozinha" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content card-sistema">
            <div class="modal-body text-center pt-4">
                <i class="bi bi-question-circle-fill text-success fs-1 mb-3 d-block"></i>
                <p class="mb-4">Marcar pedido da <strong id="nome-mesa-cozinha">--</strong> como <strong>pronto</strong>? O garçom fará a entrega.</p>
                <div class="d-flex justify-content-center gap-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Não</button>
                    <button type="button" class="btn btn-sm btn-success px-3" id="btnConfirmarPronto">Sim, Pronto</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- TOAST -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:1060">
    <div id="toastCozinha" class="toast align-items-center text-white bg-dark border-0 shadow" role="alert" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body d-flex align-items-center gap-2">
                <i class="bi bi-check2-circle text-success"></i>
                <span id="toastCozinhaMensagem"></span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Guarda qual comanda foi selecionada para marcar como pronta
    let selecionadoParaPronto = null; // { mesa, comandaIdx }

    function obterDadosMesas() {
        const dados = JSON.parse(localStorage.getItem('burguerflow_mesas')) || {};
        Object.keys(dados).forEach(n => {
            const mesa = dados[n];
            if (!mesa.comandas) {
                mesa.comandas = (mesa.itens && mesa.itens.length > 0)
                    ? [{ id: 1, itens: mesa.itens }] : [];
                delete mesa.itens;
            }
            mesa.comandas.forEach(c => { if (!c.itens) c.itens = []; });
        });
        return dados;
    }

    function salvarDadosMesas(dados) {
        localStorage.setItem('burguerflow_mesas', JSON.stringify(dados));
        renderizarFilaCozinha();
    }

    function exibirToastCozinha(msg) {
        document.getElementById('toastCozinhaMensagem').innerText = msg;
        new bootstrap.Toast(document.getElementById('toastCozinha'), { delay: 3000 }).show();
    }

    function renderizarFilaCozinha() {
        const dados = obterDadosMesas();
        const cont  = document.getElementById('fila-cozinha-container');
        cont.innerHTML = "";
        let temPedido = false;

        Object.keys(dados).forEach(numMesa => {
            const mesa = dados[numMesa];
            (mesa.comandas || []).forEach((comanda, cidx) => {

                // Apenas itens de cozinha pendentes/em preparo/prontos
                const itens = comanda.itens.filter(it =>
                    (it.categoria === "cozinha" || !it.categoria) &&
                    (it.status === "Pendente" || it.status === "Em preparo" || it.status === "Pronto")
                );
                if (itens.length === 0) return;
                temPedido = true;

                const emPreparo   = itens.some(it => it.status === "Em preparo");
                const todosProntos = itens.every(it => it.status === "Pronto");
                const badgeText   = todosProntos ? "Pronto p/ Retirada" : emPreparo ? "Em Preparo" : "Pendente";
                const badgeClass  = todosProntos ? "bg-success text-white" : emPreparo ? "bg-primary text-white" : "bg-warning text-dark";

                const btnIniciar  = emPreparo || todosProntos ? "disabled" : "";
                const btnPronto   = emPreparo && !todosProntos ? "" : "disabled";

                let itensHTML = "";
                itens.forEach(item => {
                    const obs = item.obs ? `<p class="small text-muted mb-1 fst-italic">Obs: ${item.obs}</p>` : '';
                    itensHTML += `<p class="mb-1"><strong>1x ${item.produto}</strong></p>${obs}`;
                });

                const cardId = `pedido-m${numMesa}-c${cidx}`;
                cont.innerHTML += `
                    <div id="${cardId}" class="col-md-6 col-lg-4">
                        <div class="card card-sistema h-100 shadow-sm border-dark">
                            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                                <div>
                                    <strong class="fs-5">Mesa ${numMesa}</strong>
                                    <span class="ms-2 badge bg-secondary">Comanda ${comanda.id}</span>
                                </div>
                                <span class="badge ${badgeClass} fw-bold">${badgeText}</span>
                            </div>
                            <div class="card-body d-flex flex-column justify-content-between">
                                <div>
                                    <h6 class="text-muted border-bottom pb-2">ITENS DO PEDIDO:</h6>
                                    ${itensHTML}
                                </div>
                                <div class="d-flex gap-2 mt-4">
                                    <button onclick="iniciarPreparo('${numMesa}',${cidx})"
                                        class="btn btn-outline-warning btn-perfil w-50 py-2 small" ${btnIniciar}>
                                        <i class="bi bi-play-fill"></i> Iniciar
                                    </button>
                                    <button onclick="solicitarConclusao('${numMesa}',${cidx})"
                                        class="btn btn-verde btn-perfil w-50 py-2 small" ${btnPronto}>
                                        <i class="bi bi-check-circle"></i> Pronto
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
        });

        if (!temPedido) {
            cont.innerHTML = `
                <div class="col-12 text-center py-5">
                    <i class="bi bi-emoji-smile text-muted fs-1 mb-2 d-block"></i>
                    <p class="text-muted fs-5">Nenhum pedido pendente na chapa!</p>
                </div>`;
        }
    }

    function iniciarPreparo(numMesa, cidx) {
        const dados = obterDadosMesas();
        dados[numMesa].comandas[cidx].itens.forEach(item => {
            if (item.status === "Pendente") item.status = "Em preparo";
        });
        salvarDadosMesas(dados);
        exibirToastCozinha(`Preparo iniciado — Mesa ${numMesa} / Comanda ${dados[numMesa].comandas[cidx].id}!`);
    }

    function solicitarConclusao(numMesa, cidx) {
        selecionadoParaPronto = { mesa: numMesa, cidx };
        const dados   = obterDadosMesas();
        const comanda = dados[numMesa].comandas[cidx];
        document.getElementById('nome-mesa-cozinha').innerText = `Mesa ${numMesa} / Comanda ${comanda.id}`;
        new bootstrap.Modal(document.getElementById('modalConfirmarCozinha')).show();
    }

    document.getElementById('btnConfirmarPronto').addEventListener('click', function() {
        bootstrap.Modal.getInstance(document.getElementById('modalConfirmarCozinha')).hide();
        if (!selecionadoParaPronto) return;

        const { mesa, cidx } = selecionadoParaPronto;
        const dados = obterDadosMesas();
        const comanda = dados[mesa].comandas[cidx];

        comanda.itens.forEach(item => {
            if (item.status === "Em preparo") item.status = "Pronto";
        });

        salvarDadosMesas(dados);
        exibirToastCozinha(`Mesa ${mesa} / Comanda ${comanda.id} — pronto! Aguardando garçom.`);
        selecionadoParaPronto = null;
    });

    window.onload = renderizarFilaCozinha;

    window.addEventListener('storage', function(e) {
        if (e.key === 'burguerflow_mesas') renderizarFilaCozinha();
    });
</script>
</body>
</html>
