<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BurguerFlow - Cozinha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="estilo.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-fire"></i> Monitor da Cozinha (Fila de Preparo)</h2>
            <a href="dashboard.html" class="btn btn-outline-secondary btn-sm">Voltar</a>
        </div>

        <div class="row g-3 px-1" id="fila-cozinha-container" style="max-height: 75vh; overflow-y: auto;">
            </div>
    </div>

    <div class="modal fade" id="modalConfirmarCozinha" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content card-sistema">
                <div class="modal-body text-center pt-4">
                    <i class="bi bi-question-circle-fill text-success fs-1 mb-3 d-block"></i>
                    <p class="mb-4">Deseja marcar o pedido da <strong id="nome-mesa-cozinha">--</strong> como pronto e enviar para expedição?</p>
                    <div class="d-flex justify-content-center gap-2">
                        <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Não</button>
                        <button type="button" class="btn btn-sm btn-success px-3" id="btnConfirmarPronto">Sim, Pronto</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1060">
        <div id="toastCozinha" class="toast align-items-center text-white bg-dark border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2">
                    <i class="bi bi-check2-circle text-success"></i>
                    <span id="toastCozinhaMensagem">Pedido pronto!</span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let mesaSelecionadaParaPronto = "";

        function obterDadosMesas() {
            return JSON.parse(localStorage.getItem('burguerflow_mesas')) || {};
        }

        function salvarDadosMesas(dados) {
            localStorage.setItem('burguerflow_mesas', JSON.stringify(dados));
            renderizarFilaCozinha(); // Remonta a tela na hora
        }

        function exibirToastCozinha(mensagem) {
            document.getElementById('toastCozinhaMensagem').innerText = mensagem;
            const toastEl = document.getElementById('toastCozinha');
            const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
            toast.show();
        }

        // --- RENDERIZAR FILA DA COZINHA DINAMICAMENTE ---
        function renderizarFilaCozinha() {
            const dados = obterDadosMesas();
            const container = document.getElementById('fila-cozinha-container');
            container.innerHTML = ""; // Limpa os estáticos

            let temPedido = false;

            Object.keys(dados).forEach(numMesa => {
                const mesa = dados[numMesa];
                
                // Filtra para pegar apenas itens que foram de fato ENVIADOS (status Pendente ou Em preparo)
                const itensParaCozinha = mesa.itens.filter(item => item.status === "Pendente" || item.status === "Em preparo");

                if (itensParaCozinha.length > 0) {
                    temPedido = true;

                    // Determina o status geral da Mesa baseado nos itens dela
                    const possuiItemEmPreparo = itensParaCozinha.some(item => item.status === "Em preparo");
                    const statusGeralText = possuiItemEmPreparo ? "Em Preparo" : "Pendente";
                    const statusGeralBadge = possuiItemEmPreparo ? "bg-primary text-white" : "bg-warning text-dark";

                    // Cria o HTML dos itens do card
                    let itensHTML = "";
                    itensParaCozinha.forEach(item => {
                        const obsHTML = item.obs ? `<p class="small text-muted mb-3 fst-italic">Obs: ${item.obs}</p>` : '';
                        itensHTML += `
                            <p class="mb-1"><strong>1x ${item.produto}</strong></p>
                            ${obsHTML}
                        `;
                    });

                    // Controla ativação dos botões
                    const btnIniciarDisabled = possuiItemEmPreparo ? "disabled" : "";
                    const btnProntoDisabled = possuiItemEmPreparo ? "" : "disabled";

                    container.innerHTML += `
                        <div id="pedido-m${numMesa}" class="col-md-6 col-lg-4">
                            <div class="card card-sistema h-100 shadow-sm border-dark">
                                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                                    <strong class="fs-5">Mesa ${numMesa}</strong>
                                    <span id="badge-m${numMesa}" class="badge ${statusGeralBadge} fw-bold">${statusGeralText}</span>
                                </div>
                                <div class="card-body d-flex flex-column justify-content-between">
                                    <div>
                                        <h6 class="text-muted border-bottom pb-2">ITENS DO PEDIDO:</h6>
                                        ${itensHTML}
                                    </div>
                                    <div class="d-flex gap-2 mt-4">
                                        <button id="btn-ini-m${numMesa}" onclick="iniciarPreparoMesa('${numMesa}')" class="btn btn-outline-warning btn-perfil w-50 py-2 small" ${btnIniciarDisabled}>
                                            <i class="bi bi-play-fill"></i> Iniciar
                                        </button>
                                        <button id="btn-pronto-m${numMesa}" onclick="solicitarConclusaoCozinha('${numMesa}')" class="btn btn-verde btn-perfil w-50 py-2 small" ${btnProntoDisabled}>
                                            <i class="bi bi-check-circle"></i> Pronto
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            if (!temPedido) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="bi bi-emoji-smile text-muted fs-1 mb-2 d-block"></i>
                        <p class="text-muted fs-5">Nenhum pedido pendente na chapa por enquanto!</p>
                    </div>
                `;
            }
        }

        // --- INICIAR PREPARO DA MESA ---
        function iniciarPreparoMesa(numMesa) {
            const dados = obterDadosMesas();
            
            // Passa todos os itens Pendentes dessa mesa para "Em preparo"
            dados[numMesa].itens.forEach(item => {
                if (item.status === "Pendente") {
                    item.status = "Em preparo";
                }
            });

            salvarDadosMesas(dados);
            exibirToastCozinha(`Preparo iniciado para a Mesa ${numMesa}!`);
        }

        // --- ABRIR MODAL DE CONCLUSÃO ---
        function solicitarConclusaoCozinha(numMesa) {
            mesaSelecionadaParaPronto = numMesa;
            document.getElementById('nome-mesa-cozinha').innerText = `Mesa ${numMesa}`;
            
            const modalEl = document.getElementById('modalConfirmarCozinha');
            const modal = new bootstrap.Modal(modalEl);
            modal.show();
        }

        // --- CONFIRMAR "PRONTO" NO MODAL ---
        document.getElementById('btnConfirmarPronto').addEventListener('click', function() {
            const modalEl = document.getElementById('modalConfirmarCozinha');
            const modal = bootstrap.Modal.getInstance(modalEl);
            modal.hide();
            
            const dados = obterDadosMesas();
            
            // Cozinha finalizou: muda os itens de "Em preparo" para "Entregue"
            dados[mesaSelecionadaParaPronto].itens.forEach(item => {
                if (item.status === "Em preparo") {
                    item.status = "Entregue";
                }
            });

            // Aplica efeito de transição visual antes de sumir
            const card = document.getElementById(`pedido-m${mesaSelecionadaParaPronto}`);
            if (card) {
                card.style.transition = 'all 0.4s ease';
                card.style.opacity = '0';
                card.style.transform = 'scale(0.9)';
                setTimeout(() => {
                    salvarDadosMesas(dados);
                    exibirToastCozinha(`Pedido da Mesa ${mesaSelecionadaParaPronto} enviado para a expedição!`);
                }, 400);
            } else {
                salvarDadosMesas(dados);
            }
        });

        // Carrega a fila assim que entra na tela
        window.onload = function() {
            renderizarFilaCozinha();
        };

        // Escuta alterações vindas da tela do garçom e atualiza a cozinha na hora!
        window.addEventListener('storage', function(e) {
            if (e.key === 'burguerflow_mesas') {
            renderizarFilaCozinha();
            }
        });
    </script>
</body>
</html>
