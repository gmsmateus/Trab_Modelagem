<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BurguerFlow - Login Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="estilo.css">
    <style>
        .wrapper-login {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
        }
        .card-login {
            width: 100%;
            max-width: 380px;
        }
    </style>
</head>
<body>

    <div class="wrapper-login">
        <div class="card card-sistema p-4 shadow-sm card-login text-center">
            <div class="mb-4">
                <div class="display-5 text-dark mb-2">
                    <i class="bi bi-shield-lock-fill text-secondary"></i>
                </div>
                <h4 class="fw-bold m-0">Acesso Restrito</h4>
                <p class="text-muted small mt-1">Digite a senha de gerência para acessar o painel administrativo.</p>
            </div>
            
            <div class="mb-4 text-start">
                <label class="form-label small fw-bold">Senha de Gerência</label>
                <div class="input-group has-validation">
                    <input type="password" id="senhaInput" class="form-control text-center py-2" placeholder="••••••••" autofocus>
                    <button class="btn btn-outline-secondary" type="button" id="btnToggleAdmin" onclick="toggleVerSenha()">
                        <i class="bi bi-eye" id="iconeToggleAdmin"></i>
                    </button>
                    <div id="feedbackAdmin" class="invalid-feedback">Senha incorreta. Tente novamente.</div>
                </div>
            </div>

            <div class="d-grid gap-2">
                <button type="button" class="btn btn-verde py-2 fw-bold text-dark" onclick="autenticarEEntrar()">
                    <i class="bi bi-box-arrow-in-right"></i> Confirmar Acesso
                </button>
                <a href="dashboard.html" class="btn btn-outline-secondary btn-sm py-2">
                    Voltar ao Dashboard
                </a>
            </div>
        </div>
    </div>

    <script>
        const SENHA_PADRAO = "1234";
        const senhaInput = document.getElementById('senhaInput');
        const feedbackEl = document.getElementById('feedbackAdmin');

        function toggleVerSenha() {
            const input = document.getElementById('senhaInput');
            const icon = document.getElementById('iconeToggleAdmin');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }

        function autenticarEEntrar() {
            const senhaDigitada = senhaInput.value;
            const senhaSalva = localStorage.getItem('burguerflow_senha_admin') || SENHA_PADRAO;

            if (senhaDigitada === senhaSalva) {
                window.location.href = "admin.html";
            } else {
                senhaInput.classList.add('is-invalid');
                senhaInput.value = "";
                senhaInput.focus();
            }
        }

        senhaInput.addEventListener('input', function() {
            this.classList.remove('is-invalid');
        });

        senhaInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') autenticarEEntrar();
        });
    </script>
</body>
</html>
